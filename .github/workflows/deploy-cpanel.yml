name: Deploy to cPanel
 
on:
  push:
    branches: [main, master]
  workflow_dispatch:
 
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
 
      - name: Install dependencies
        run: npm ci
 
      - name: Build project
        run: npm run build
 
      - name: Copy PHP backend into build output
        run: |
          cp public/submit.php dist/submit.php
          cp public/submit-config.example.php dist/submit-config.example.php
          cp -r public/phpmailer dist/phpmailer
 
      - name: Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: public_html/
          local-dir: dist/
          dry-run: false
          exclude: |
            **/.git*
            **/.git*/**
 
      - name: Verify production endpoint
        run: |
          ok=0
          for base in https://www.bigfixtech.com https://bigfixtech.com; do
            code=$(curl -sSL -o /tmp/smoke-body.txt -w '%{http_code}' --max-time 30 "$base/submit.php" || true)
            echo "$base/submit.php -> HTTP ${code}"
            if [ "$code" = "500" ]; then
              echo "::warning::$base/submit.php returned HTTP 500 - submit-config.php may be missing on the server. Upload it manually via cPanel File Manager."
              ok=1
              break
            fi
            if [ "$code" = "405" ]; then
              echo "OK: submit.php is live and answering JSON (405 for GET)."
              ok=1
              break
            fi
            if [ "$code" = "000" ]; then
              echo "::warning::$base could not be reached - the deployment may be unreachable or still warming up."
              continue
            fi
            echo "::error::$base/submit.php returned HTTP $code (expected 405 - the endpoint executes PHP and rejects GET with JSON). The production backend is broken. Response body (first 500 bytes):"
            head -c 500 /tmp/smoke-body.txt || true
            echo
            exit 1
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::BigFix production endpoint is not responding on any hostname."
            exit 1
          fi
