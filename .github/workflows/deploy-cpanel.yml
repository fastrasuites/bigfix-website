name: Deploy to cPanel

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Copy PHP backend into build output
        run: |
          cp public/submit.php dist/submit.php
          cp public/submit-config.example.php dist/submit-config.example.php
          cp -r public/phpmailer dist/phpmailer
          # sql/ is intentionally NOT deployed - publishing schema.sql under the web root is a security risk. Import it once via cPanel > phpMyAdmin.

      - name: Create submit-config.php from secret
        id: config
        env:
          SUBMIT_CONFIG_B64: ${{ secrets.SUBMIT_CONFIG_B64 }}
        run: |
          if [ -z "$SUBMIT_CONFIG_B64" ]; then
            echo "::warning::SUBMIT_CONFIG_B64 secret is NOT SET. The production server will keep its existing submit-config.php if present. Set the secret to manage credentials from GitHub: base64 of submit-config.php."
            exit 0   # allow deployment without overwriting the config on the server
          fi
          # Try to decode; if any step fails, warn but DON'T fail the deploy —
          # the server's existing submit-config.php (uploaded via cPanel) will be preserved
          if echo "$SUBMIT_CONFIG_B64" | base64 --decode > dist/submit-config.php 2>/dev/null; then
            if [ ! -s dist/submit-config.php ] || ! head -c 5 dist/submit-config.php | grep -q '<?php'; then
              echo "::warning::Decoded submit-config.php is empty or does not start with <?php — will keep existing server config."
              rm -f dist/submit-config.php
            elif ! grep -q "'db_host'" dist/submit-config.php || ! grep -q "'to_email'" dist/submit-config.php || ! grep -q "'smtp_pass'" dist/submit-config.php; then
              echo "::warning::Decoded submit-config.php is missing required keys — will keep existing server config."
              rm -f dist/submit-config.php
            else
              echo "submit-config.php decoded and validated ($(wc -c < dist/submit-config.php) bytes)."
            fi
          else
            echo "::warning::SUBMIT_CONFIG_B64 is not valid base64 — will keep existing server config. Re-create the secret from the raw submit-config.php."
            rm -f dist/submit-config.php
          fi

      - name: Note: no submit-config.php in dist (server will keep its existing config)
        if: ${{ !hashFiles('dist/submit-config.php') }}
        run: echo "No submit-config.php in dist — server will keep its existing config."

      - name: Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: public_html/
          local-dir: dist/
          dry-run: false
          exclude: |
            **/.git*
            **/.git*/**

      - name: Verify production endpoint
        run: |
          ok=0
          for base in https://www.bigfixtech.com https://bigfixtech.com; do
            code=$(curl -sSL -o /tmp/smoke-body.txt -w '%{http_code}' --max-time 30 "$base/submit.php" || true)
            echo "$base/submit.php -> HTTP ${code}"
            if [ "$code" = "405" ]; then
              echo "OK: submit.php is live and answering JSON (405 for GET)."
              ok=1
              break
            fi
            if [ "$code" = "000" ]; then
              echo "::warning::$base could not be reached - the deployment may be unreachable or still warming up."
              continue
            fi
            echo "::error::$base/submit.php returned HTTP $code (expected 405 - the endpoint executes PHP and rejects GET with JSON). The production backend is broken. Response body (first 500 bytes):"
            head -c 500 /tmp/smoke-body.txt || true
            echo
            exit 1
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::BigFix production endpoint is not responding on any hostname (https://www.bigfixtech.com and https://bigfixtech.com). The deployment may have failed or the site is down."
            exit 1
          fi
