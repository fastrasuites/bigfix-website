name: Deploy to cPanel
 
on:
  push:
    branches: [main, master]
  workflow_dispatch:
 
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
 
      - name: Install dependencies
        run: npm ci
 
      - name: Build project
        run: npm run build
 
      - name: Copy PHP backend into build output
        run: |
          cp public/submit.php dist/submit.php
          cp public/submit-config.example.php dist/submit-config.example.php
          cp -r public/phpmailer dist/phpmailer
          # Copy tracking API files
          mkdir -p dist/api/tracking/session dist/api/lib dist/api/migrations dist/api/data dist/api/cache
          cp api/tracking/events.php dist/api/tracking/events.php
          cp api/tracking/identify.php dist/api/tracking/identify.php
          cp api/tracking/cleanup.php dist/api/tracking/cleanup.php
          cp api/tracking/exit-intent.php dist/api/tracking/exit-intent.php
          cp api/tracking/enrich.php dist/api/tracking/enrich.php
          cp api/tracking/session/init.php dist/api/tracking/session/init.php
          cp api/tracking/session/hello.php dist/api/tracking/session/hello.php
          cp api/tracking/session/minimal_test.php dist/api/tracking/session/minimal_test.php
          cp api/tracking/session/syntax_check.php dist/api/tracking/session/syntax_check.php
          cp api/lib/IpEnricher.php dist/api/lib/IpEnricher.php
          cp api/lib/DeviceDetector.php dist/api/lib/DeviceDetector.php
          cp api/lib/TrackingService.php dist/api/lib/TrackingService.php
          cp api/migrations/003_absolute_tracking.sql dist/api/migrations/003_absolute_tracking.sql
          cp api/migrations/004_sync_tracking_schema.sql dist/api/migrations/004_sync_tracking_schema.sql
          cp api/migrations/MigrationRunner.php dist/api/migrations/MigrationRunner.php
          cp api/migrate.php dist/api/migrate.php
          touch dist/api/cache/.gitkeep dist/api/data/.gitkeep
          # Create submit-config.php from GitHub secret (base64-encoded)
          if [ -n "${{ secrets.SUBMIT_CONFIG_B64 }}" ]; then
            echo '${{ secrets.SUBMIT_CONFIG_B64 }}' | base64 -d > dist/submit-config.php
          else
            echo "::warning::SUBMIT_CONFIG_B64 secret not set - submit-config.php will be missing on production. Upload it manually via cPanel File Manager."
          fi
 
      - name: Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: public_html/
          local-dir: dist/
          dry-run: false
          exclude: |
            **/.git*
            **/.git*/**
            dist/submit-config.example.php

      - name: Run database schema migration
        run: |
          for base in https://www.bigfixtech.com https://bigfixtech.com; do
            code=$(curl -sSL -o /tmp/migrate-body.txt -w '%{http_code}' --max-time 30 -X POST \
              -H 'Content-Type: application/json' \
              "$base/api/migrate.php" || true)
            echo "$base/api/migrate.php -> HTTP ${code}"
            if [ "$code" = "200" ]; then
              echo "OK: Schema migration completed."
              cat /tmp/migrate-body.txt
              break
            fi
            if [ "$code" = "500" ]; then
              echo "::warning::Migration endpoint returned HTTP 500 (schema-agnostic code will still work without migration)"
              cat /tmp/migrate-body.txt | head -c 1000
            fi
          done

      - name: Verify production endpoint
        run: |
          ok=0
          for base in https://www.bigfixtech.com https://bigfixtech.com; do
            code=$(curl -sSL -o /tmp/smoke-body.txt -w '%{http_code}' --max-time 30 "$base/submit.php" || true)
            echo "$base/submit.php -> HTTP ${code}"
            if [ "$code" = "500" ]; then
              echo "::warning::$base/submit.php returned HTTP 500 - submit-config.php may be missing on the server. Upload it manually via cPanel File Manager."
              ok=1
              break
            fi
            if [ "$code" = "405" ]; then
              echo "OK: submit.php is live and answering JSON (405 for GET)."
              ok=1
              break
            fi
            if [ "$code" = "000" ]; then
              echo "::warning::$base could not be reached - the deployment may be unreachable or still warming up."
              continue
            fi
            echo "::error::$base/submit.php returned HTTP $code (expected 405 - the endpoint executes PHP and rejects GET with JSON). The production backend is broken. Response body (first 500 bytes):"
            head -c 500 /tmp/smoke-body.txt || true
            echo
            exit 1
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::BigFix production endpoint is not responding on any hostname."
            exit 1
          fi

      - name: Verify tracking endpoint
        run: |
          ok=0
          for base in https://www.bigfixtech.com https://bigfixtech.com; do
            code=$(curl -sSL -o /tmp/tracking-body.txt -w '%{http_code}' --max-time 30 -X POST \
              -H 'Content-Type: application/json' \
              -H "Origin: $base" \
              -d '{"landing_page":"https://bigfixtech.com/","referrer":"","user_agent":"Deploy-Verify"}' \
              "$base/api/tracking/session/init.php" || true)
            echo "$base/api/tracking/session/init.php -> HTTP ${code}"
            if [ "$code" = "200" ]; then
              echo "OK: Tracking session init endpoint is live."
              cat /tmp/tracking-body.txt
              ok=1
              break
            fi
            if [ "$code" = "500" ]; then
              echo "::warning::Tracking endpoint returned HTTP 500 - check submit-config.php and database tables."
              cat /tmp/tracking-body.txt | head -c 500
            fi
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::Tracking endpoint failed on all hostnames."
            exit 1
          fi
